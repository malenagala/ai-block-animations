  <!-- Text panel -->
  <div class="flex flex-col lg:w-1/3 lg:self-center space-y-5 pl-0 relative lg:space-y-4 lg:pb-5 xl:pb-0">
    <h2 class="font-semibold tight mb-0">1. Get Results</h2>
    <p>Portfolio analysis, screens and charts ready for client eyes.</p>
  </div>

  <!-- Animation panel -->
  <div class="relative flex flex-col lg:w-2/3 w-full">
    <style>
      #anim-typing {
        --zoom: 1.6;   /* ← adjust zoom here (1.0 = normal, 1.2 = 20% bigger, etc.) */
        width: 100%; max-width: 700px; height: 408px;
        margin-left: auto; margin-right: 0;
        display: flex; align-items: center; justify-content: center;
        background: linear-gradient(118.553deg, rgb(241,236,250) 4.2557%, rgb(221,232,247) 71.485%);
        border-radius: 16px; overflow: hidden; position: relative;
      }
      /* Tablet */
      @media (max-width: 1023px) { #anim-typing { height: 360px; max-width: 560px; } }
      /* Mobile */
      @media (max-width: 767px)  { #anim-typing { height: 280px; } }
      #anim-typing video {
        position: absolute; inset: 0; width: 100%; height: 100%;
        object-fit: cover;
        transform: scale(var(--zoom)); transform-origin: center center;
        border-radius: 16px;
      }
    </style>

    <div id="anim-typing">
      <video autoplay loop muted playsinline style="position:absolute;inset:0;width:100%;height:100%;object-fit:cover;border-radius:16px;transform:scale(var(--zoom));transform-origin:center center;">
        <source src="../mp4s/refinement-video.mp4" type="video/mp4">
      </video>
    </div>

        <script>
    (function () {
      function apply() {
        var w = window.innerWidth;
        var container = document.getElementById('anim-typing');
        if (w <= 767) {
          var parentLeft = container.parentElement.getBoundingClientRect().left;
          container.style.marginLeft = '-' + parentLeft + 'px';
          container.style.width      = '100vw';
          container.style.maxWidth   = '100vw';
        } else {
          container.style.marginLeft = 'auto';
          container.style.width      = '';
          container.style.maxWidth   = '';
        }
      }
      apply();
      window.addEventListener('resize', apply);
    })();
    </script>
  </div>

</div>
